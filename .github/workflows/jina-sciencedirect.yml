name: Jina ScienceDirect Counts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: pip install requests
      - name: Collect via Jina Reader
        run: python scripts/jina_sciencedirect_counts.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jina-sciencedirect-counts
          path: |
            jina_sciencedirect_counts.json
            jina_*.md
          if-no-files-found: warn
