name: ScienceDirect Annual Counts Playwright

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Collect annual counts
        run: python scripts/sciencedirect_playwright_counts.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sciencedirect-annual-counts
          path: |
            sciencedirect_annual_counts.json
            sd_artifacts/
          if-no-files-found: warn
