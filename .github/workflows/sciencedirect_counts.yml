name: Retrieve ScienceDirect counts

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install curl_cffi
      - name: Retrieve counts
        run: |
          python - <<'PY'
          import json, re, time
          from urllib.parse import urlencode
          from curl_cffi import requests

          countries = [
              'Malaysia', 'Japan', 'Iceland', 'New Zealand',
              'Indonesia', 'Italy', 'Turkey', 'Kenya'
          ]
          session = requests.Session(impersonate='chrome124')
          base = 'https://www.sciencedirect.com'
          headers = {'Accept-Language': 'en-US,en;q=0.9'}

          def get_count(country):
              query = f'"hot spring" AND "geothermal resource" AND "{country}"'
              page_params = {'qs': query, 'date': '2010-2025', 'show': 25, 'offset': 0}
              page_url = base + '/search?' + urlencode(page_params)
              r = session.get(page_url, headers=headers, timeout=40)
              print('PAGE', country, r.status_code, len(r.text))
              if r.status_code != 200:
                  return {'error': f'page_http_{r.status_code}'}
              m = re.search(r'"searchToken":"([^"]+)"', r.text)
              if not m:
                  open(f'{country.replace(" ", "_")}_page.html','w',encoding='utf-8').write(r.text[:100000])
                  return {'error':'search_token_not_found'}
              token = m.group(1)
              api_params = dict(page_params)
              api_params.update({'t': token, 'hostname': 'www.sciencedirect.com'})
              api_url = base + '/search/api?' + urlencode(api_params)
              a = session.get(api_url, headers={
                  **headers,
                  'Accept':'application/json, text/javascript, */*; q=0.01',
                  'Referer':page_url,
                  'X-Requested-With':'XMLHttpRequest'
              }, timeout=40)
              print('API', country, a.status_code, len(a.text))
              if a.status_code != 200:
                  return {'error': f'api_http_{a.status_code}', 'body': a.text[:500]}
              data = a.json()
              return {
                  'resultsFound': data.get('resultsFound', data.get('totalResults')),
                  'facets': data.get('facets',{}).get('years',[])[:20]
              }

          out = {}
          for country in countries:
              try:
                  out[country] = get_count(country)
              except Exception as e:
                  out[country] = {'error': repr(e)}
              time.sleep(3)
          print('COUNTS_JSON=' + json.dumps(out, ensure_ascii=False, sort_keys=True))
          PY