name: Jina ScienceDirect Annual Counts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: pip install requests
      - name: Collect annual counts
        run: python scripts/jina_sciencedirect_annual_counts.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sciencedirect-country-annual-counts
          path: |
            sciencedirect_country_annual_counts.json
            sciencedirect_country_annual_counts.csv
          if-no-files-found: warn
