name: Iceland 2013-2015 Counts

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/iceland_2013_2015_counts.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iceland-2013-2015-counts
          path: iceland_2013_2015_counts.json
          if-no-files-found: warn
